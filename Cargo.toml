[workspace]
members = ["app", "updater", "tests/scenario/wasdk-toast"]
default-members = ["app"]
resolver = "3"

[workspace.dependencies]
icoextract_rs = "0.1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
kumo-contracts = { git = "https://github.com/kumoproject/kumo-contracts", rev = "29b7b50" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "http2"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
single-instance = "0.3"
url = "2"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "d5b6a1f68f4fdd0c79495954d162901ea90da4f4" }
windows-pickers = { git = "https://github.com/microsoft/windows-rs", rev = "d5b6a1f68f4fdd0c79495954d162901ea90da4f4", default-features = false }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "d5b6a1f68f4fdd0c79495954d162901ea90da4f4" }
winresource = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
