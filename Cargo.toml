[workspace]
members = ["app", "updater", "tests/scenario/wasdk-toast"]
default-members = ["app"]
resolver = "3"

[workspace.dependencies]
icoextract_rs = "0.1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "http2"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
single-instance = "0.3"
url = "2"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "af92a168e17085b4b3fd4e88f9f2cb83893b8563" }
windows-notifyicon = { git = "https://github.com/microsoft/windows-rs", rev = "af92a168e17085b4b3fd4e88f9f2cb83893b8563" }
windows-pickers = { git = "https://github.com/microsoft/windows-rs", rev = "af92a168e17085b4b3fd4e88f9f2cb83893b8563", default-features = false }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "af92a168e17085b4b3fd4e88f9f2cb83893b8563" }
winresource = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
