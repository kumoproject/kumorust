[package]
name = "kumorust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
rfd = { version = "0.17", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "79d8db43bbd38167941416cea2004dd3067e785a", features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "System",
    "UI_Notifications",
    "appmodel",
    "combaseapi",
    "objidl",
    "objbase",
    "propidlbase",
    "propkey",
    "shobjidl_core",
    "winerror",
    "handleapi",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "winnt",
    "wtypes",
    "shellapi",
    "wingdi",
    "winuser",
] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "79d8db43bbd38167941416cea2004dd3067e785a" }
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "79d8db43bbd38167941416cea2004dd3067e785a" }
