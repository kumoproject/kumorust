[package]
name = "kumorust"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["updater"]
resolver = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
icoextract_rs = "0.1.2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
single-instance = "0.3.3"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "a8a5d720331920100326c89044f950b703a5b4cd", features = [
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "appmodel",
    "commctrl",
    "combaseapi",
    "libloaderapi",
    "objidl",
    "objbase",
    "propkey",
    "propsys",
    "propidlbase",
    "propvarutil",
    "shellapi",
    "shobjidl_core",
    "wingdi",
    "winnt",
    "winerror",
    "winuser",
] }
windows-reactor = "0.100"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
