[package]
name = "kumorust"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["updater"]
resolver = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
icoextract_rs = "0.1.2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
single-instance = "0.3.3"
url = "2"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "af92a168e17085b4b3fd4e88f9f2cb83893b8563", features = [
    "appmodel",
    "commctrl",
    "libloaderapi",
    "shellapi",
    "winerror",
    "winuser",
] }
windows-reactor = "0.100"

[build-dependencies]
winresource = "0.1.31"

