[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
dist = true
targets = ["aarch64-pc-windows-msvc"]
windows-archive = ".zip"

# windows-reactor-setup writes these files to the target-specific dist profile
# directory during a dist build.
# Keep them beside kumorust.exe so the self-contained WinUI runtime is usable.
include = [
    "target/aarch64-pc-windows-msvc/dist/CoreMessagingXP.dll",
    "target/aarch64-pc-windows-msvc/dist/dcompi.dll",
    "target/aarch64-pc-windows-msvc/dist/dwmcorei.dll",
    "target/aarch64-pc-windows-msvc/dist/marshal.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.DirectManipulation.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.InputStateManager.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.Internal.FrameworkUdk.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Composition.OSSupport.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Input.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Windowing.Core.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Windowing.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Xaml.Controls.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.ui.xaml.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.UI.Xaml.Phone.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.ui.xaml.resources.19h1.dll",
    "target/aarch64-pc-windows-msvc/dist/Microsoft.Windows.ApplicationModel.Resources.dll",
    "target/aarch64-pc-windows-msvc/dist/MRM.dll",
    "target/aarch64-pc-windows-msvc/dist/resources.pri",
]
